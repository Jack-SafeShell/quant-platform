# Quant configuration belongs to the monolithic entry point, not a separate service.
yudao:
  quant:
    enabled: ${QUANT_BACKTEST_ENABLED:false}
    paper-execution-enabled: false
    paper-start-token-ttl-seconds: 300
    paper-observation-interval-seconds: ${QUANT_PAPER_OBSERVATION_INTERVAL:60}
    paper-snapshot-retention-days: 30
    paper-risk-policy-version: paper-risk-v1
    paper-max-order-notional: 100
    paper-max-total-exposure: 100
    paper-max-open-positions: 1
    paper-max-daily-loss: 20
    paper-max-drawdown-ratio: 0.05
    workspace: ${QUANT_WORKSPACE:D:/0000/quant-platform/.runtime/quant}
    docker-executable: ${QUANT_DOCKER_EXECUTABLE:docker}
    image: ${QUANT_FREQTRADE_IMAGE:freqtradeorg/freqtrade@sha256:7031bca43ed7668ebf421725dd5016acade6ef88b0771db3e08c96e6d19a42db}
    exchange-proxy: ${QUANT_EXCHANGE_PROXY:}
    python-executable: ${QUANT_PYTHON_EXECUTABLE:python}
    dataset-script: ${QUANT_DATASET_SCRIPT:D:/0000/quant-platform/script/quant/prepare_dataset.py}
    timeout-seconds: ${QUANT_BACKTEST_TIMEOUT:600}
